# Monthly, with minor and patch updates grouped into one PR per ecosystem.
# Major updates and security updates still come as their own PRs.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    # Wait a week before proposing a new release. Security updates ignore this.
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
