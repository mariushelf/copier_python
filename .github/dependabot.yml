version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    # Wait a week before proposing a new release. Security updates ignore this.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    # "/template" holds the workflows that generated projects receive.
    directories:
      - "/"
      - "/template"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
